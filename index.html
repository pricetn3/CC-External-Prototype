<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credential Connections prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .view { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; opacity: 0; visibility: hidden; transition: opacity 200ms cubic-bezier(0.2,0.6,0.2,1), visibility 0s linear 200ms; }
  .view.on { opacity: 1; visibility: visible; transition: opacity 200ms cubic-bezier(0.2,0.6,0.2,1), visibility 0s; z-index: 1; }
  .rail { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); z-index: 10; width: 168px; box-sizing: border-box; padding: 18px 14px 12px; background: #fff; border-radius: 20px; box-shadow: 0 12px 32px -8px rgba(10,13,18,0.18), 0 2px 6px rgba(10,13,18,0.06); font-family: Inter, system-ui, sans-serif; }
  .rail[hidden], .tab[hidden] { display: none; }
  .x { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 9999px; border: 1px solid #E9EAEB; background: #fff; color: #535862; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 2px rgba(10,13,18,0.05); padding: 0; }
  .x:hover { background: #F5F5F5; color: #181D27; }
  .lbl { font: 600 11px/16px Inter, system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #414651; }
  .grp { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; padding: 3px; background: #F5F5F5; border-radius: 10px; }
  .opt { display: flex; align-items: center; height: 30px; padding: 0 9px; border-radius: 7px; border: 0; background: transparent; text-align: left; cursor: pointer; font: 400 13px/18px Inter, system-ui, sans-serif; color: #414651; transition: background-color 150ms, color 150ms; }
  .opt:hover { background: rgba(255,255,255,0.7); color: #181D27; }
  .opt.on { background: #fff; color: #181D27; font-weight: 600; box-shadow: 0 1px 2px rgba(10,13,18,0.08), 0 0 0 1px rgba(10,13,18,0.04); cursor: default; }
  .foot { margin-top: 14px; padding-top: 10px; border-top: 1px solid #E9EAEB; text-align: center; font: 400 11px/16px Inter, system-ui, sans-serif; color: #717680; }
  .tab { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 10; height: 72px; width: 22px; border: 1px solid #E9EAEB; border-right: 0; border-radius: 10px 0 0 10px; background: #fff; color: #535862; box-shadow: 0 1px 2px rgba(10,13,18,0.05); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
</style>
</head>
<body>
<iframe id="v-internal" class="view on" src="internal.html?embed=1" title="Internal view"></iframe>
<iframe id="v-external" class="view" src="external.html?embed=1" title="External view"></iframe>

<div class="rail" id="rail">
  <button class="x" id="hide" aria-label="Hide panel"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div class="lbl" style="text-align:center;">Prototype</div>
  <div class="lbl" style="margin-top:14px;">View</div>
  <div class="grp">
    <button class="opt on" data-view="internal">Internal</button>
    <button class="opt" data-view="external">External</button>
  </div>
  <div class="foot">Shift+H hides this panel</div>
</div>
<button class="tab" id="show" aria-label="Show prototype panel" hidden><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>

<script>
(function () {
  var frames = { internal: document.getElementById('v-internal'), external: document.getElementById('v-external') };
  var state = { internal: null, external: null };
  var cur = location.hash === '#external' ? 'external' : 'internal';
  var rail = document.getElementById('rail'), tab = document.getElementById('show');

  function keyOf(win) { return win === frames.internal.contentWindow ? 'internal' : win === frames.external.contentWindow ? 'external' : null; }
  function setRail(open) {
    rail.hidden = !open; tab.hidden = open;
    try { localStorage.setItem('cc-viewrail-hidden', open ? '0' : '1'); } catch (e) {}
  }
  function paint() {
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('on', k === cur); });
    document.querySelectorAll('.opt').forEach(function (b) { b.classList.toggle('on', b.dataset.view === cur); });
  }
  function go(next) {
    if (next === cur) return;
    var s = state[cur];
    if (s) frames[next].contentWindow.postMessage({ type: 'cc-sync', screen: s.screen, signedOut: s.signedOut }, '*');
    cur = next;
    history.replaceState(null, '', next === 'external' ? '#external' : location.pathname + location.search);
    setTimeout(paint, 30);
  }

  window.addEventListener('message', function (e) {
    var d = e.data || {}, k = keyOf(e.source);
    if (!k) return;
    if (d.type === 'cc-state') state[k] = { screen: d.screen, signedOut: d.signedOut };
    if (d.type === 'cc-toggle-rail') setRail(rail.hidden);
  });
  document.querySelectorAll('.opt').forEach(function (b) { b.addEventListener('click', function () { go(b.dataset.view); }); });
  document.getElementById('hide').addEventListener('click', function () { setRail(false); });
  tab.addEventListener('click', function () { setRail(true); });
  window.addEventListener('keydown', function (e) { if (e.shiftKey && (e.key === 'H' || e.key === 'h')) setRail(rail.hidden); });

  var hidden = false; try { hidden = localStorage.getItem('cc-viewrail-hidden') === '1'; } catch (e) {}
  setRail(!hidden);
  paint();
})();
</script>
</body>
</html>
